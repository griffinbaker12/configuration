# vim:ft=kitty
## name: Sonokai (default)
## upstream: https://github.com/sainnhe/sonokai

# nvim runs sonokai with termguicolors off, so it paints with xterm-256
# indices (Normal bg = color235). The color16-255 overrides below remap those
# indices to sonokai's real hex values, so nvim's background is the same
# #2c2e34 as the terminal's and nothing shifts when nvim opens.

background #2c2e34
foreground #e2e2e3
selection_background #3b3e48
selection_foreground #e2e2e3
url_color #76cce0
# none = reverse video: the cursor takes the color of the text it's on (blue
# on a blue keyword) and that character is drawn in the background color.
cursor none

active_border_color #7f8490
inactive_border_color #3b3e48

active_tab_background #3b3e48
active_tab_foreground #e2e2e3
inactive_tab_background #33353f
inactive_tab_foreground #7f8490

# ANSI colors, same mapping sonokai uses for nvim's :terminal
color0  #181819
color8  #7f8490
color1  #fc5d7c
color9  #fc5d7c
color2  #9ed072
color10 #9ed072
color3  #e7c664
color11 #e7c664
color4  #76cce0
color12 #76cce0
color5  #b39df3
color13 #b39df3
color6  #f39660
color14 #f39660
color7  #e2e2e3
color15 #e2e2e3

# 256-color indices sonokai's cterm palette uses
color17  #354157
color22  #394634
color52  #55393d
color107 #9ed072
color110 #76cce0
color176 #b39df3
color179 #e7c664
color203 #fc5d7c
color215 #f39660
color232 #222327
color235 #2c2e34
color236 #33353f
color237 #3b3e48
color240 #595f6f
color246 #7f8490
color250 #e2e2e3
